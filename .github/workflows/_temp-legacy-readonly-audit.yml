name: TEMP Legacy Readonly Audit

on:
  push:
    branches:
      - audit/legacy-readonly-20260831
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Load public Supabase runtime values without logging them
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import os, re

          values = {}
          env_path = Path('.env')
          if env_path.exists():
              for raw in env_path.read_text(encoding='utf-8', errors='replace').splitlines():
                  line = raw.strip()
                  if not line or line.startswith('#') or '=' not in line:
                      continue
                  k, v = line.split('=', 1)
                  k, v = k.strip(), v.strip().strip('"').strip("'")
                  values[k] = v

          if not values.get('VITE_SUPABASE_URL') or not values.get('VITE_SUPABASE_PUBLISHABLE_KEY'):
              text = Path('src/integrations/supabase/client.ts').read_text(encoding='utf-8', errors='replace')
              m_url = re.search(r'const\s+SUPABASE_URL\s*=\s*["\']([^"\']+)', text)
              m_key = re.search(r'const\s+SUPABASE_PUBLISHABLE_KEY\s*=\s*["\']([^"\']+)', text)
              if m_url:
                  values.setdefault('VITE_SUPABASE_URL', m_url.group(1))
              if m_key:
                  values.setdefault('VITE_SUPABASE_PUBLISHABLE_KEY', m_key.group(1))

          required = ('VITE_SUPABASE_URL', 'VITE_SUPABASE_PUBLISHABLE_KEY')
          missing = [k for k in required if not values.get(k)]
          if missing:
              raise SystemExit('missing public runtime configuration: ' + ','.join(missing))

          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              for k in required:
                  f.write(f'{k}={values[k]}\n')
          PY

      - name: Produce sanitized code and API inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json, os, re, subprocess, tempfile

          report = []
          report.append('LEGACY_READONLY_AUDIT_V1')
          report.append('expected_project_ref=moijoyqwapimforpijdc')
          report.append('runtime_url_matches_expected=' + str('moijoyqwapimforpijdc.supabase.co' in os.environ['VITE_SUPABASE_URL']).lower())

          # Only key NAMES are reported. Values are never emitted.
          env_keys = []
          if Path('.env').exists():
              for raw in Path('.env').read_text(encoding='utf-8', errors='replace').splitlines():
                  line = raw.strip()
                  if line and not line.startswith('#') and '=' in line:
                      env_keys.append(line.split('=', 1)[0].strip())
          privileged_markers = ('SERVICE_ROLE', 'DATABASE_URL', 'POSTGRES', 'DB_PASSWORD', 'SUPABASE_ACCESS_TOKEN', 'SECRET_KEY')
          privileged_names = sorted(k for k in env_keys if any(marker in k.upper() for marker in privileged_markers))
          report.append('tracked_env_key_names=' + ','.join(sorted(set(env_keys))))
          report.append('tracked_privileged_key_names=' + (','.join(privileged_names) if privileged_names else 'none'))

          # Generated Supabase types are the best code-level schema snapshot.
          types_path = Path('src/integrations/supabase/types.ts')
          text = types_path.read_text(encoding='utf-8', errors='replace')
          def section_names(start, end):
              s = text.find(start)
              e = text.find(end, s + len(start)) if s >= 0 else -1
              if s < 0 or e < 0:
                  return []
              chunk = text[s:e]
              return re.findall(r'^      ([A-Za-z0-9_]+): \\{$', chunk, flags=re.M)
          tables = section_names('    Tables: {', '    Views: {')
          views = section_names('    Views: {', '    Functions: {')
          functions = section_names('    Functions: {', '    Enums: {')
          report.append(f'generated_tables_count={len(tables)}')
          report.append('generated_tables=' + ','.join(tables))
          report.append(f'generated_views_count={len(views)}')
          report.append('generated_views=' + ','.join(views))
          report.append(f'generated_rpcs_count={len(functions)}')
          report.append('generated_rpcs=' + ','.join(functions))

          # Edge Functions and their config-level JWT setting.
          config = Path('supabase/config.toml').read_text(encoding='utf-8', errors='replace') if Path('supabase/config.toml').exists() else ''
          verify = {}
          current = None
          for line in config.splitlines():
              m = re.match(r'\[functions\.([^\]]+)\]', line.strip())
              if m:
                  current = m.group(1)
              elif current and line.strip().startswith('verify_jwt'):
                  verify[current] = line.split('=',1)[1].strip()
          edge = sorted(p.parent.name for p in Path('supabase/functions').glob('*/index.ts')) if Path('supabase/functions').exists() else []
          report.append(f'edge_functions_count={len(edge)}')
          for name in edge:
              report.append(f'edge_function={name}|verify_jwt={verify.get(name,"default")}' )

          # Anonymous OpenAPI discovery with the project's own public browser key.
          url = os.environ['VITE_SUPABASE_URL'].rstrip('/')
          key = os.environ['VITE_SUPABASE_PUBLISHABLE_KEY']
          with tempfile.TemporaryDirectory() as td:
              openapi = Path(td) / 'openapi.json'
              cmd = [
                  'curl','-sS','--max-time','20','-o',str(openapi),'-w','%{http_code}',
                  '-H',f'apikey: {key}','-H',f'Authorization: Bearer {key}',
                  '-H','Accept: application/openapi+json', f'{url}/rest/v1/'
              ]
              status = subprocess.check_output(cmd, text=True).strip()
              report.append('anon_openapi_status=' + status)
              api_tables, api_rpcs = [], []
              if status == '200' and openapi.exists():
                  try:
                      obj = json.loads(openapi.read_text(encoding='utf-8', errors='replace'))
                      for path in obj.get('paths', {}):
                          if path.startswith('/rpc/'):
                              api_rpcs.append(path.removeprefix('/rpc/'))
                          elif path.startswith('/') and path.count('/') == 1:
                              api_tables.append(path[1:])
                  except Exception as exc:
                      report.append('openapi_parse_error=' + type(exc).__name__)
              api_tables = sorted(set(api_tables))
              api_rpcs = sorted(set(api_rpcs))
              report.append(f'anon_openapi_tables_count={len(api_tables)}')
              report.append('anon_openapi_tables=' + ','.join(api_tables))
              report.append(f'anon_openapi_rpcs_count={len(api_rpcs)}')
              report.append('anon_openapi_rpcs=' + ','.join(api_rpcs))

              # HEAD only. No row bodies are downloaded or printed.
              for table in api_tables:
                  hdr = Path(td) / 'headers.txt'
                  qurl = f'{url}/rest/v1/{table}?select=*'
                  cmd = [
                      'curl','-sS','--max-time','15','-X','HEAD','-D',str(hdr),'-o','/dev/null','-w','%{http_code}',
                      '-H',f'apikey: {key}','-H',f'Authorization: Bearer {key}',
                      '-H','Prefer: count=exact', qurl
                  ]
                  try:
                      code = subprocess.check_output(cmd, text=True).strip()
                  except subprocess.CalledProcessError:
                      code = 'curl_error'
                  content_range = ''
                  if hdr.exists():
                      for line in hdr.read_text(encoding='utf-8', errors='replace').splitlines():
                          if line.lower().startswith('content-range:'):
                              content_range = line.split(':',1)[1].strip()
                  report.append(f'anon_head={table}|http={code}|content_range={content_range or "none"}')

          Path('legacy-readonly-audit.txt').write_text('\n'.join(report) + '\n', encoding='utf-8')
          print('\n'.join(report))
          PY

      - name: Upload sanitized audit
        uses: actions/upload-artifact@v4
        with:
          name: legacy-readonly-audit
          path: legacy-readonly-audit.txt
          if-no-files-found: error
