name: TEMP Check Legacy Exporter

on:
  push:
    branches:
      - feature/legacy-export-bridge-20260831

permissions:
  contents: write

jobs:
  deno-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Normalize handler typing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('supabase/functions/legacy-migration-export/index.ts')
          s = p.read_text()
          s = s.replace('Deno.serve(async (req) => {', 'Deno.serve(async (req: Request): Promise<Response> => {')
          s = s.replace('''      default:\n        return jsonResponse({ error: "invalid_action" }, 400);\n    }\n  } catch (error) {''', '''      default:\n        break;\n    }\n    return jsonResponse({ error: "invalid_action" }, 400);\n  } catch (error) {''')
          p.write_text(s)
          PY
          deno fmt supabase/functions/legacy-migration-export/index.ts
      - name: Deno check
        run: deno check supabase/functions/legacy-migration-export/index.ts
      - name: Commit validated normalization
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/legacy-migration-export/index.ts
          git commit -m "fix: make legacy exporter handler return type explicit"
          git push
